#app{max-width:560px;margin:0 auto;padding:14px 16px 110px}
header{display:flex;align-items:center;gap:10px;margin:6px 0 16px}
header h1{flex:1;margin:0;font-size:26px;font-weight:800;letter-spacing:.3px}
.ib{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--tx);font-size:20px;display:grid;place-items:center;cursor:pointer;font-family:inherit}
.ib.ac{background:linear-gradient(135deg,var(--ac),#1a7bff);border-color:transparent;font-size:26px;font-weight:600}
.hero{display:flex;align-items:center;gap:16px;padding:6px 2px 20px}
.hero img{width:78px;height:78px;border-radius:22px;box-shadow:0 10px 30px rgba(44,196,255,.35)}
.hero h2{margin:0;font-size:38px;line-height:1;font-weight:800;letter-spacing:1px}
.hero h2 span{color:var(--ac2)}
.hero p{margin:6px 0 0;color:var(--mut);font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;min-height:112px;padding:14px;border-radius:22px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--tx);text-decoration:none;font:inherit;text-align:left;cursor:pointer;transition:transform .15s}
.tile:active{transform:scale(.96)}
.tile .e{font-size:30px}
.tile b{font-size:17px;font-weight:600}
.tile small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.tile.w{grid-column:span 2;min-height:0;flex-direction:row;align-items:center;gap:14px}
.card{display:flex;align-items:center;gap:12px;padding:14px;margin-bottom:10px;border-radius:20px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);cursor:pointer}
.card .m{flex:1;min-width:0}
.card .t{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.card .s{color:var(--mut);font-size:13px;margin-top:3px;overflow-wrap:anywhere}
.date{flex:none;width:52px;text-align:center;padding:7px 0;border-radius:14px;background:linear-gradient(160deg,var(--ac),#1a7bff)}
.date b{display:block;font-size:20px;line-height:1}
.date i{font-style:normal;font-size:11px;text-transform:uppercase;letter-spacing:.8px;opacity:.9}
.chk{flex:none;width:30px;height:30px;border-radius:10px;border:2px solid var(--mut);background:transparent;color:#06202e;font-size:18px;font-weight:800;cursor:pointer;display:grid;place-items:center}
.done .chk{background:var(--ok);border-color:var(--ok)}
.done .t{text-decoration:line-through;opacity:.55}
.chip{flex:none;padding:6px 12px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--line);font-family:inherit;color:var(--tx);background:var(--glass2);cursor:pointer}
.chip.paid{background:rgba(61,220,151,.2);border-color:var(--ok);color:var(--ok)}
.chip.open{background:rgba(255,93,108,.18);border-color:var(--bad);color:#ff9aa4}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.sum div{padding:12px 8px;border-radius:18px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);text-align:center}
.sum small{display:block;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.8px}
.sum b{font-size:17px}
h3{margin:18px 4px 8px;font-size:12px;color:var(--ac2);text-transform:uppercase;letter-spacing:1.4px}
.empty{text-align:center;color:var(--mut);padding:34px 18px;border:1px dashed var(--line);border-radius:22px;line-height:1.5;background:var(--glass)}
.empty .e{font-size:40px;display:block;margin-bottom:8px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 12px calc(env(safe-area-inset-bottom,0px) + 10px)}
nav div{display:flex;gap:4px;width:100%;max-width:520px;padding:6px;border-radius:26px;border:1px solid var(--line);background:rgba(10,24,42,.78);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
nav button{flex:1;border:0;border-radius:20px;padding:8px 0 6px;background:transparent;color:var(--mut);font:inherit;font-size:11px;cursor:pointer}
nav button span{display:block;font-size:22px;line-height:1.2}
nav button.on{background:rgba(44,196,255,.18);color:var(--ac2)}
.sheet-bg{position:fixed;inset:0;background:rgba(3,10,20,.62);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:560px;max-height:92%;overflow:auto;padding:20px 18px calc(env(safe-area-inset-bottom,0px) + 18px);border-radius:28px 28px 0 0;background:#10233a;border:1px solid var(--line);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h4{margin:0 0 14px;font-size:20px}
label{display:block;margin:0 0 12px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.8px}
input,select,textarea{display:block;width:100%;margin-top:6px;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--tx);font:inherit;font-size:16px;text-transform:none;letter-spacing:0}
textarea{min-height:84px;resize:vertical}
select option{color:#111}
.hint{display:block;margin-top:5px;text-transform:none;letter-spacing:0;font-size:12px}
.row{display:flex;gap:10px;margin-top:6px}
.btn{flex:1;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--glass2);color:var(--tx);font:inherit;font-size:16px;font-weight:600;cursor:pointer}
.btn.p{background:linear-gradient(135deg,var(--ac),#1a7bff);border-color:transparent}
.btn.d{color:#ff9aa4;border-color:rgba(255,93,108,.5)}
.btn.arm{background:var(--bad);color:#fff;border-color:transparent}
.adm .btn{display:block;width:100%;margin-bottom:10px;text-align:left}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(60% 40% at 15% 8%,rgba(44,196,255,.28),transparent 70%),radial-gradient(50% 35% at 90% 30%,rgba(140,90,255,.24),transparent 70%),radial-gradient(60% 40% at 50% 100%,rgba(255,120,200,.14),transparent 70%);mix-blend-mode:screen}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#app{position:relative;z-index:1}
nav{z-index:10}
.hero{padding:14px 2px 28px}
.hero img{width:92px;height:92px;border-radius:26px;transform:rotate(-6deg);box-shadow:0 0 0 1px rgba(255,255,255,.35),0 18px 44px -8px rgba(44,196,255,.75);animation:float 5s ease-in-out infinite}
.hero h2{font-size:54px;letter-spacing:2px;background:linear-gradient(100deg,#fff 20%,#9be8ff 50%,#fff 80%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 6s linear infinite}
.hero h2 span{background:linear-gradient(90deg,#2cc4ff,#b07bff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
header h1{background:linear-gradient(90deg,#fff,#9be8ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.grid>:nth-child(1){--c:#2cc4ff}.grid>:nth-child(2){--c:#ffc83d}.grid>:nth-child(3){--c:#ff7a59}.grid>:nth-child(4){--c:#3ddc97}.grid>:nth-child(5){--c:#b07bff}.grid>:nth-child(6){--c:#ff5d6c}.grid>:nth-child(7){--c:#ff6fd8}.grid>:nth-child(8){--c:#5ee7df}
.tile{--c:var(--ac);overflow:hidden;border-radius:26px;min-height:136px;background:linear-gradient(160deg,rgba(255,255,255,.15),rgba(255,255,255,.03) 45%),var(--glass);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 14px 34px -14px rgba(0,0,0,.7);animation:pop .55s cubic-bezier(.2,.9,.3,1.2) both}
.tile::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,var(--c),transparent 68%);opacity:.4;pointer-events:none}
.tile .e{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:28px;background:linear-gradient(145deg,var(--c),rgba(255,255,255,.08) 150%);box-shadow:0 10px 24px -8px var(--c),inset 0 1px 0 rgba(255,255,255,.4)}
.tile b{font-size:18px;font-weight:700}
.grid>:nth-child(n+3){animation-delay:.1s}.grid>:nth-child(n+5){animation-delay:.2s}.grid>:nth-child(n+7){animation-delay:.3s}
.card{border-radius:22px;background:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,.02) 50%),var(--glass);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 10px 26px -14px rgba(0,0,0,.7);transition:transform .15s}
.card:active{transform:scale(.98)}
.date{border-radius:16px;box-shadow:0 8px 20px -6px var(--ac)}
.ib.ac{box-shadow:0 8px 22px -6px var(--ac)}
nav div{border-radius:30px;box-shadow:0 18px 40px -10px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.18)}
nav button{transition:all .2s}
nav button span{transition:transform .2s}
nav button.on{background:linear-gradient(160deg,rgba(44,196,255,.32),rgba(176,123,255,.22));color:#fff;box-shadow:0 0 18px -4px var(--ac)}
nav button.on span{transform:translateY(-2px) scale(1.15)}
.sum div{background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.02)),var(--glass);border-radius:20px}
.sum b{font-size:18px}
h3{display:flex;align-items:center;gap:10px}h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.btn.p{box-shadow:0 10px 24px -8px var(--ac)}
.sheet{background:linear-gradient(180deg,#14304d,#0d1d31)}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.94)}}
@keyframes float{50%{transform:rotate(-6deg) translateY(-6px)}}
@keyframes shine{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.pl{display:block;cursor:default}
.opt{position:relative;display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:8px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--tx);font:inherit;font-size:15px;cursor:pointer;overflow:hidden;text-align:left}
.opt i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(44,196,255,.45),rgba(176,123,255,.35));transition:width .4s}
.opt span,.opt b{position:relative}
.opt.me{border-color:var(--ac2);box-shadow:0 0 14px -4px var(--ac)}
.today{padding:16px;margin-bottom:16px;border-radius:26px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(44,196,255,.22),rgba(176,123,255,.14) 60%,rgba(255,255,255,.03)),var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}
.tr{display:flex;gap:12px;align-items:flex-start;padding:9px 0;font-size:15px;line-height:1.35}
.tr+.tr{border-top:1px solid var(--line)}
.tr>span{font-size:22px}
.grid>:nth-child(9){--c:#8fd14f}.grid>:nth-child(10){--c:#ffa94d}.grid>:nth-child(11){--c:#5aa9ff}
.grid>:nth-child(n+9){animation-delay:.4s}
.grid>:last-child:nth-child(odd){grid-column:span 2;min-height:100px}
.ready .tile{animation:none}

function info(){var h=S.info[0]||{};
 if(!h.addr&&!h.pw&&!h.kass)return head("Haus-Infos","info")+empty("🏠","Trag über das ✎ die Adresse, das WLAN-Passwort und den Kassenwart ein.");

 (h.pw||h.wifi?'<div class="card pl"><div class="m"><h3 style="margin:0 0 6px">WLAN</h3>'+(h.wifi?'<div class="t">'+esc(h.wifi)+'</div>':'')+(h.pw?'<div class="s">Passwort: <b>'+esc(h.pw)+'</b></div><button class="chip" style="margin-top:10px" data-copy="'+esc(h.pw)+'">Passwort kopieren</button>':'')+'</div></div>':'')+
 (h.kass?'<div class="card pl"><div class="m"><h3 style="margin:0 0 6px">Kassenwart</h3><div class="t">'+esc(h.kass)+'</div></div></div>':'');}
function cook(){
 var a=S.cook.slice().sort(function(x,y){return (x.date||"").localeCompare(y.date||"")});
 return head("Kochdienste","cook")+(a.length?a.map(function(x){var d=dparts(x.date);
  return '<div class="card" data-edit="cook" data-id="'+x.id+'"><div class="date"><b>'+d[0]+'</b><i>'+d[1]+'</i></div><div class="m"><div class="t">Kochgruppe: '+esc(x.who)+'</div><div class="s">'+esc(x.what)+'</div></div></div>'}).join("")
  :empty("🍳","Hier können sich die Kochgruppen mit ihren geplanten Abendessen über das „+“ Zeichen eintragen.<br>Bitte macht dies, damit alle informiert sind, was es wann zu essen gibt!"));
}
function shop(){
 var open=S.shop.filter(function(x){return!x.done}),done=S.shop.filter(function(x){return x.done});
 var item=function(x){return '<div class="card'+(x.done?' done':'')+'"><button class="chk" data-tog="shop" data-id="'+x.id+'" aria-label="Abhaken">'+(x.done?'✓':'')+'</button><div class="m" data-edit="shop" data-id="'+x.id+'"><div class="t">'+esc(x.name)+'</div><div class="s">'+esc(x.cat)+'</div></div></div>'};
 var out=head("Einkaufsliste","shop");
 if(!S.shop.length)return out+empty("🛒","Füge über das „+“ Zeichen neue Lebensmittel der Liste hinzu!");
 CATS.forEach(function(c){var g=open.filter(function(x){return x.cat==c});if(g.length)out+='<h3>'+c+'</h3>'+g.map(item).join("")});

function exp(){
 var all=S.exp.reduce(function(a,x){return a+x.sum},0),paid=S.exp.filter(function(x){return x.paid}).reduce(function(a,x){return a+x.sum},0);
 var a=S.exp.slice().sort(function(x,y){return (y.date||"").localeCompare(x.date||"")}),by={};S.exp.forEach(function(x){if(!x.paid)by[x.who]=(by[x.who]||0)+x.sum});var ns=Object.keys(by),kw=S.info[0]&&S.info[0].kass;

 (ns.length?'<h3>'+(kw?'Kassenwart '+esc(kw)+' zahlt aus':'Noch auszuzahlen')+'</h3>'+ns.map(function(n){return '<div class="card pl" style="display:flex;align-items:center;gap:12px"><span style="font-size:24px">💸</span><div class="m"><div class="t">'+esc(n)+'</div></div><b>'+eur(by[n])+'</b></div>'}).join("")+'<h3>Alle Ausgaben</h3>':'')+
 (a.length?a.map(function(x){var d=dparts(x.date);
  return '<div class="card"><div class="date"><b>'+d[0]+'</b><i>'+d[1]+'</i></div><div class="m" data-edit="exp" data-id="'+x.id+'"><div class="t">'+esc(x.who)+'</div><div class="s">'+eur(x.sum)+'</div></div><button class="chip '+(x.paid?'paid':'open')+'" data-tog="exp" data-id="'+x.id+'">'+(x.paid?'Ausgezahlt':'Offen')+'</button></div>'}).join("")
  :empty("💶","Füge über das „+“ Zeichen eine neue Ausgabe hinzu!"));

function black(){
 return head("Blacklist","black")+(S.black.length?S.black.map(function(x){
  return '<div class="card" data-edit="black" data-id="'+x.id+'"><span style="font-size:26px">🚫</span><div class="m"><div class="t">'+esc(x.was)+'</div><div class="s">'+esc(x.wer)+'</div></div></div>'}).join("")

var VIEWS={home:home,cook:cook,shop:shop,exp:exp,black:black,plan:plan,poll:poll,info:info};
function render(){
 app.innerHTML=VIEWS[cur]();
 document.getElementById("nav").innerHTML=TABS.map(function(t){return '<button data-go="'+t[0]+'" class="'+(cur==t[0]?'on':'')+'"><span>'+t[1]+'</span>'+t[2]+'</button>'}).join("");
 window.scrollTo(0,0);

/* Formulare */
var FORMS={
 cook:{title:"Abendessen",f:[["date","Datum","date"],["who","Wer kocht?","text","Teilnehmer bitte mit Komma trennen!"],["what","Was gibt es?","area"]],req:["date","who","what"]},
 shop:{title:"Auf Einkaufsliste setzen",f:[["name","Lebensmittel","text"],["cat","Kategorie","sel"]],req:["name"]},

};
FORMS.plan={title:"Skitag planen",f:[["date","Datum","date"],["station","Talstation","sel",null,STATIONS],["time","Uhrzeit (optional)","time"],["who","Wer fährt mit? (optional)","text"]],req:["date","station"]};

function sheet(html){var b=document.createElement("div");b.className="sheet-bg";b.innerHTML='<div class="sheet">'+html+'</div>';b.addEventListener("click",function(e){if(e.target==b)b.remove()});document.body.appendChild(b);return b}
function armBtn(btn,fn,label){var armed=false;btn.addEventListener("click",function(){if(!armed){armed=true;btn.classList.add("arm");btn.textContent=label||"Sicher? Nochmal tippen";setTimeout(function(){armed=false;btn.classList.remove("arm");btn.textContent=btn.dataset.l},3500)}else fn()})}
function openForm(kind,id){
 var F=FORMS[kind],rec=id?S[kind].filter(function(x){return x.id==id})[0]:(kind=="info"?S.info[0]:null);
 var today=td();
 var h='<h4>'+(rec?"Bearbeiten":F.title)+'</h4>'+F.f.map(function(f){var v=rec?rec[f[0]]:(f[2]=="date"?today:(f[2]=="sel"?(f[4]||CATS)[0]:""));if(Array.isArray(v))v=v.join("\n");var c;
  if(f[2]=="area")c='<textarea name="'+f[0]+'">'+esc(v)+'</textarea>';
  else if(f[2]=="sel")c='<select name="'+f[0]+'">'+(f[4]||CATS).map(function(o){return '<option'+(o==v?' selected':'')+'>'+o+'</option>'}).join("")+'</select>';
  else c='<input name="'+f[0]+'" type="'+(f[2]=="num"?'number" step="0.01" inputmode="decimal':f[2])+'" value="'+esc(v)+'">';
  return '<label>'+f[1]+c+(f[3]?'<span class="hint">'+f[3]+'</span>':'')+'</label>'}).join("")+
  '<div class="row"><button class="btn" data-x>Abbrechen</button>'+(rec?'<button class="btn d" data-del data-l="Löschen">Löschen</button>':'')+'<button class="btn p" data-ok>Speichern</button></div><div class="hint" data-err style="color:#ff9aa4;margin-top:10px"></div>';
 var b=sheet(h);
 b.querySelector("[data-x]").onclick=function(){b.remove()};
 b.querySelector("[data-ok]").onclick=function(){
  var o={};F.f.forEach(function(f){o[f[0]]=b.querySelector('[name="'+f[0]+'"]').value.trim()});
  for(var i=0;i<F.req.length;i++){if(!o[F.req[i]]){b.querySelector("[data-err]").textContent="Du hast was vergessen. Bitte überprüfe deine Eingabe.";return}}
  if(kind=="poll"){o.opts=o.opts.split("\n").map(function(x){return x.trim()}).filter(Boolean);if(o.opts.length<2){b.querySelector("[data-err]").textContent="Bitte mindestens zwei Antworten eintragen.";return}}
  if(o.sum!==undefined)o.sum=parseFloat(String(o.sum).replace(",","."))||0;
  if(rec){Object.keys(o).forEach(function(k){rec[k]=o[k]});put(kind,rec)}else{o.id=kind=="info"?"house":uid();if(kind=="shop")o.done=false;if(kind=="exp")o.paid=false;put(kind,o)}
  b.remove();refresh()};
 var d=b.querySelector("[data-del]");
 if(d)armBtn(d,function(){del(kind,id);b.remove();refresh()});
}
function admin(){

document.addEventListener("click",function(e){
 var t=e.target.closest("[data-go],[data-add],[data-edit],[data-tog],[data-admin],[data-vote],[data-copy]");if(!t||t.closest(".sheet-bg"))return;
 if(t.dataset.go){cur=t.dataset.go;render()}
 else if(t.hasAttribute("data-admin"))admin();
 else if(t.dataset.add)openForm(t.dataset.add);
 else if(t.dataset.tog){var r=S[t.dataset.tog].filter(function(x){return x.id==t.dataset.id})[0];if(r){if(t.dataset.tog=="shop")r.done=!r.done;else r.paid=!r.paid;put(t.dataset.tog,r);refresh()}}

 else if(t.dataset.copy){try{navigator.clipboard.writeText(t.dataset.copy);t.textContent="Kopiert ✓"}catch(e){}}
 else if(t.dataset.edit)openForm(t.dataset.edit,t.dataset.id);
});
